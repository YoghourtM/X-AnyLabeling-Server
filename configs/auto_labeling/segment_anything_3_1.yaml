model_id: segment_anything_3_1
display_name: "Segment Anything 3.1"
batch_processing_mode: "text_prompt"

params:
  # Upstream SAM 3.1 checkpoint (facebook/sam3.1). The docker launcher mounts
  # its directory at /ckpt.
  model_path: "/ckpt/sam3.1_multiplex.pt"
  image_size: 1008
  # shared: one SAM 3.1 multiplex model serves every task (~5.5 GB GPU).
  # image_model: text / example boxes use a separate SAM 3 image model with
  #   the 3.1 detector weights, as in the batch pipelines; its scores run
  #   ~0.1 higher, but it needs ~4 GB more once clicks are used.
  detector: shared
  conf_threshold: 0.5
  epsilon_factor: 0.001
  show_boxes: false
  # Click / box segmentation with the SAM 3.1 tracker. With
  # detector=image_model the tracker loads on first use. False hides the task.
  interactive: true
  # Images whose tracker session (image features) stays cached.
  cache_size: 4
  # FlashAttention 3 needs a Hopper GPU.
  use_fa3: false

# Defaults for every widget used by the tasks in get_metadata().
widgets:
  - name: edit_text
    value: null
  - name: button_send
    value: null
  - name: input_conf
    value: null
  - name: edit_conf
    value: 0.5
  - name: button_add_point
    value: null
  - name: button_remove_point
    value: null
  - name: button_add_rect
    value: null
  - name: add_pos_rect
    value: null
  - name: add_neg_rect
    value: null
  - name: button_run_rect
    value: null
  - name: button_clear
    value: null
  - name: button_finish_object
    value: null
  - name: mask_fineness_slider
    value: 10
  - name: mask_fineness_value_label
    value: null
  - name: toggle_preserve_existing_annotations
    value: false
